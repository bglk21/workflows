name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Weekly rebuild so the image picks up base-image security patches.
    - cron: '17 4 * * 1'
  workflow_dispatch:
  # Called by release.yml to publish version tags for a new release.
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v, e.g. 1.2.3
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  # github.workflow differs when called from release.yml, so a release build
  # never cancels (or is cancelled by) the regular build of the same commit.
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=v${{ inputs.version }},enable=${{ inputs.version != '' && !startsWith(inputs.version, '0.') }}

      # Pull requests only build (no push) to prove the image still builds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t workflows:ci .
          docker run -d --name wf -p 3000:3000 workflows:ci
          for i in $(seq 1 20); do curl -fs http://localhost:3000/api/workflows && exit 0; sleep 1; done
          docker logs wf
          exit 1
