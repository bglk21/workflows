# Run Workflows locally:  docker compose up -d   →  http://localhost:3000
services:
  workflows:
    image: ghcr.io/bglk21/workflows:latest
    # To build from this checkout instead of pulling, replace `image:` with:
    # build: .
    container_name: workflows
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - workflows-data:/data

volumes:
  workflows-data:
