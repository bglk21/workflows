<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflows</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="icon.svg" alt="">
      <span>Workflows</span>
    </div>

    <div class="group">
      <select id="workflow-select" title="Open workflow" aria-label="Open workflow"></select>
      <div class="menu-wrap">
        <button class="icon" data-action="toggle-menu" title="Workflow actions" aria-label="Workflow actions" aria-haspopup="menu" aria-expanded="false">⋯</button>
        <div id="workflow-menu" class="menu" role="menu" hidden>
          <button role="menuitem" data-action="new-workflow">New workflow</button>
          <button role="menuitem" data-action="rename-workflow">Rename</button>
          <button role="menuitem" data-action="export">Export JSON</button>
          <button role="menuitem" data-action="export-png">Export PNG</button>
          <button role="menuitem" data-action="import">Import JSON</button>
          <hr>
          <button role="menuitem" data-action="delete-workflow" class="menu-danger">Delete</button>
        </div>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>

    <div class="group">
      <button class="tool" data-add="process" title="Add a step" aria-label="Add a step"><span class="tool-icon" aria-hidden="true">▭</span><span class="tool-label">Step</span></button>
      <button class="tool" data-add="decision" title="Add a decision" aria-label="Add a decision"><span class="tool-icon" aria-hidden="true">◇</span><span class="tool-label">Decision</span></button>
      <button class="tool" data-add="terminal" title="Add a start or end" aria-label="Add a start or end"><span class="tool-icon" aria-hidden="true">⬭</span><span class="tool-label">Start / End</span></button>
      <button class="tool" data-add="text" title="Add text" aria-label="Add text"><span class="tool-icon" aria-hidden="true">T</span><span class="tool-label">Text</span></button>
    </div>

    <div class="group">
      <button class="icon" data-action="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button class="icon" data-action="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
      <button class="icon" data-action="fit" title="Fit to screen" aria-label="Fit to screen">⤢</button>
    </div>

    <div class="topbar-end">
      <span id="version" class="version"></span>
      <div id="save-status" class="save-status"></div>
      <button class="icon" data-action="help" title="Help" aria-label="Help">?</button>
    </div>
  </header>

  <main class="workspace">
    <div id="stage" class="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <g id="viewport">
          <g id="edges"></g>
          <g id="nodes"></g>
          <g id="overlay"></g>
        </g>
      </svg>
      <div id="zoom-indicator" class="zoom-indicator">100%</div>
    </div>
    <aside id="inspector" class="inspector"></aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
